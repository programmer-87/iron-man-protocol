<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#bc13fe"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- پس‌زمینه -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- شبکه سایبری -->
  <g stroke="#00f3ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 128 H512 M0 256 H512 M0 384 H512 M128 0 V512 M256 0 V512 M384 0 V512"/>
  </g>

  <!-- سپر آیرون‌من -->
  <g filter="url(#glow)">
    <path d="M256 80 L400 140 V260 C400 340 340 400 256 432 C172 400 112 340 112 260 V140 Z"
          fill="none" stroke="url(#neonGrad)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M256 110 L372 158 V260 C372 326 322 378 256 404 C190 378 140 326 140 260 V158 Z"
          fill="#00f3ff" fill-opacity="0.06"/>
  </g>

  <!-- هسته (Reactor) -->
  <circle cx="256" cy="250" r="52" fill="none" stroke="#00f3ff" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="250" r="34" fill="none" stroke="#bc13fe" stroke-width="4"/>
  <circle cx="256" cy="250" r="18" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="256" cy="250" r="8" fill="#ffffff"/>

  <!-- پرتوهای انرژی -->
  <g stroke="#00f3ff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M256 176 V196"/>
    <path d="M256 304 V324"/>
    <path d="M182 250 H202"/>
    <path d="M310 250 H330"/>
  </g>

  <!-- متن کوچک -->
  <text x="256" y="470" text-anchor="middle"
        font-family="sans-serif" font-size="28" font-weight="700"
        fill="#00f3ff" letter-spacing="6" opacity="0.9">IRON MAN</text>
</svg>